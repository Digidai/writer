name: Bug report
description: 报告一个问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么操作，期望什么结果，实际结果是什么
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一部分
      options:
        - 编辑器与自动保存
        - AI 输入联想
        - 归档 Agent（分类、标签、排版）
        - 归档页与检索
        - 阅读页与下载
        - 部署与配置
        - 其他
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Agent 处理轨迹（如果与归档结果有关）
      description: 在文档阅读页展开「Agent 处理轨迹」，把内容贴在这里
      render: text
  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: 例如 自部署 / writer.genedai.md，Chrome 151，macOS
