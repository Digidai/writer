<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archive · Writer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-sc.css">
<link rel="stylesheet" href="/style.css?v=0.12.0">
<script>try{var s=JSON.parse(localStorage.getItem('writer.settings')||'{}');
if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;
if(s.fontSize)document.documentElement.dataset.size=s.fontSize;
var h=(navigator.language||'').toLowerCase();
var l=s.language==='zh'||s.language==='en'?s.language:(h&&h.includes('zh')?'zh':'en');
document.documentElement.lang=l==='en'?'en':'zh-CN';}catch(e){}</script>
</head>
<body class="archive-body">

<header class="bar">
  <a class="wordmark" href="/">writer<span class="seal">.</span></a>
  <div class="bar-right">
    <noscript>
      <nav class="bar-nav">
        <a href="/">Keep writing</a>
        <a href="/settings">Settings</a>
      </nav>
    </noscript>
  </div>
</header>

<main class="archive">
  <h1 class="archive-title" data-i18n="archive.title">Archive</h1>
  <p class="archive-sub" data-i18n="archive.sub">Finished pieces, classified, parsed and typeset by the agent.</p>

  <input class="search" id="search" type="search" data-i18n-placeholder="archive.search" placeholder="Search the archive…" autocomplete="off">
  <div class="archive-actions">
    <div class="search-mode" id="search-mode" hidden>
      <button type="button" class="search-mode-button" data-mode="keyword" data-i18n="archive.modeKeyword">Keyword</button>
      <button type="button" class="search-mode-button" data-mode="semantic" data-i18n="archive.modeSemantic">Semantic</button>
    </div>
    <button type="button" class="finish export-button" id="export-all" data-i18n="archive.exportZip" hidden>Export .zip</button>
  </div>

  <section class="processing" id="processing" hidden></section>
  <div id="groups"></div>
  <p class="empty" id="empty" data-i18n-html="archive.empty" hidden>Nothing archived yet. Go <a href="/">write something</a>.</p>
  <p class="empty" id="locked" data-i18n-html="common.locked" hidden>This Writer is locked. Please <a href="/unlock">unlock</a> it first.</p>
</main>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/archive.js?v=0.12.0"></script>
</body>
</html>
