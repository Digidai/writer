<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · Writer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/lxgw-wenkai-screen.css">
<link rel="stylesheet" href="/style.css">
<script>try{var s=JSON.parse(localStorage.getItem('writer.settings')||'{}');
if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;
if(s.fontSize)document.documentElement.dataset.size=s.fontSize;}catch(e){}</script>
</head>
<body class="settings-body">

<header class="bar">
  <a class="wordmark" href="/">writer<span class="seal">.</span></a>
  <nav class="bar-nav"><a href="/archive">归档</a><a href="/">继续书写</a></nav>
</header>

<main class="settings">
  <h1 class="page-title">设置</h1>
  <p class="page-sub">这些偏好保存在你的 Writer 实例上，换设备打开也一致。</p>

  <div id="fields"></div>

  <section class="trash">
    <h2 class="cat-head">回收站<span class="rule"></span><span class="count" id="trash-count">0</span></h2>
    <p class="trash-note">删除的内容会留在这里，随时可以恢复。彻底删除会同时移除已归档的 Markdown 文件，无法撤销。</p>
    <div id="trash-list"></div>
    <p class="empty" id="trash-empty">回收站是空的。</p>
  </section>

  <p class="empty" id="locked" hidden>这台 Writer 已上锁，请先<a href="/unlock">解锁</a>。</p>
</main>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/settings.js"></script>
</body>
</html>
