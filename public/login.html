<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Writer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-sc.css">
<link rel="stylesheet" href="/style.css?v=0.14.0">
<script>try{var s=JSON.parse(localStorage.getItem('writer.settings')||'{}');
if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;
if(s.fontSize)document.documentElement.dataset.size=s.fontSize;
var h=(navigator.language||'').toLowerCase();
var l=s.language==='zh'||s.language==='en'?s.language:(h&&h.includes('zh')?'zh':'en');
document.documentElement.lang=l==='en'?'en':'zh-CN';}catch(e){}</script>
</head>
<body class="login-body">

<header class="bar">
  <a class="wordmark" href="/">writer<span class="seal">.</span></a>
  <div class="bar-right"></div>
</header>

<main class="login">
  <section class="login-sheet" id="login"></section>
</main>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/login.js?v=0.14.0"></script>
</body>
</html>
