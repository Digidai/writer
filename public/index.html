<!doctype html>
<html lang="en" class="editor-stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writer</title>
<meta name="description" content="A quiet, input-focused writing surface. Drafts save instantly; the rest goes to AI.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/files/noto-sans-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/files/noto-sans-sc-119-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/files/noto-sans-sc-118-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/noto-sans-sc.css">
<link rel="stylesheet" href="/style.css?v=0.10.0">
<script>try{var s=JSON.parse(localStorage.getItem('writer.settings')||'{}');
if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;
if(s.fontSize)document.documentElement.dataset.size=s.fontSize;
var h=(navigator.language||'').toLowerCase();
var l=s.language==='zh'||s.language==='en'?s.language:(h&&h.includes('zh')?'zh':'en');
document.documentElement.lang=l==='en'?'en':'zh-CN';}catch(e){}</script>
</head>
<body class="editor-body">

<header class="bar">
  <a class="wordmark" href="/">writer<span class="seal">.</span></a>
  <div class="bar-right">
    <span class="status" id="status"><span class="status-dot"></span><span id="status-text" data-i18n="editor.ready">Ready</span></span>
    <button class="finish" id="finish" data-i18n="editor.finish" data-i18n-title="editor.finishHint" title="Finish and archive (⌘⏎)">Finish</button>
  </div>
</header>

<main class="desk">
  <div class="sheet">
    <div class="well">
      <div class="mirror" aria-hidden="true"><span id="mirror-text"></span><span class="ghost" id="ghost"></span></div>
      <textarea class="input" id="input" data-i18n-placeholder="editor.placeholder" placeholder="Start writing…" spellcheck="false" autocomplete="off" autofocus></textarea>
    </div>
  </div>
  <div class="completion-bar" id="completion-bar" hidden>
    <button type="button" class="completion-action primary" id="completion-accept" data-i18n="editor.acceptSuggestion">Accept</button>
    <button type="button" class="completion-action" id="completion-dismiss" data-i18n="editor.dismissSuggestion">Dismiss</button>
  </div>
  <div class="hint" id="hint" data-i18n="editor.hint">Tab accepts · ⌘⏎ archives · idle pieces file themselves</div>
</main>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/app.js?v=0.10.0"></script>
</body>
</html>
