<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer</title>
<meta name="description" content="一个安静的、专注于输入的写作工具。落笔即存，其余交给 AI。A quiet, input-focused writing surface.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/files/noto-sans-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/files/noto-sans-sc-119-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/files/noto-sans-sc-118-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/noto-sans-sc.css">
<link rel="stylesheet" href="/style.css">
<script>try{var s=JSON.parse(localStorage.getItem('writer.settings')||'{}');
if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;
if(s.fontSize)document.documentElement.dataset.size=s.fontSize;
var l=s.language==='zh'||s.language==='en'?s.language:((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');
document.documentElement.lang=l==='en'?'en':'zh-CN';}catch(e){}</script>
</head>
<body class="editor-body">

<header class="bar">
  <a class="wordmark" href="/">writer<span class="seal">.</span></a>
  <div class="bar-right">
    <span class="status" id="status"><span class="status-dot"></span><span id="status-text">就绪</span></span>
    <button class="finish" id="finish" data-i18n="editor.finish" data-i18n-title="editor.finishHint" title="完成并归档（⌘⏎）">完成</button>
  </div>
</header>

<main class="desk">
  <div class="sheet">
    <div class="mirror" aria-hidden="true"><span id="mirror-text"></span><span class="ghost" id="ghost"></span></div>
    <textarea class="input" id="input" data-i18n-placeholder="editor.placeholder" placeholder="开始书写…" spellcheck="false" autocomplete="off" autofocus></textarea>
  </div>
</main>

<div class="hint" id="hint" data-i18n="editor.hint">Tab 采纳建议 · ⌘⏎ 完成归档 · 静置片刻自动归档</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
